<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project | Portfolio</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .project-detail { padding: 34px 0 64px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px; color: var(--primary); font-weight: 600; }
        .project-hero-img { width: 100%; max-height: 420px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 24px; }
        .project-detail h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); margin-bottom: 6px; }
        .project-detail .subtitle { color: var(--primary); font-weight: 600; margin-bottom: 12px; }
        .detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
        .detail-note { color: var(--muted); font-size: 0.9rem; font-style: italic; }
        .detail-links { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 26px; }
        .detail-links .btn { padding: 8px 16px; font-size: 0.88rem; }
        .detail-section-title { font-size: 1.15rem; font-weight: 700; margin: 26px 0 12px; padding-bottom: 7px; border-bottom: 2px solid var(--primary); display: inline-block; }
        .detail-body { color: var(--muted); line-height: 1.75; }
        .detail-body p { margin-bottom: 12px; text-align: justify; }
        .detail-body h2 { font-size: 1.15rem; color: var(--text); margin: 22px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .detail-body h3 { font-size: 1.02rem; color: var(--primary); margin: 20px 0 10px; }
        .detail-body ul { margin: 0 0 12px 20px; }
        .detail-body li { margin-bottom: 7px; }
        .detail-body code { background: var(--tag-bg); padding: 1px 6px; border-radius: 5px; font-size: 0.9em; }
        .contribution-list { margin: 0 0 8px 20px; color: var(--muted); line-height: 1.7; }
        .contribution-list li { margin-bottom: 9px; }
        .contribution-list strong { color: var(--text); }
        .spec-table { width: 100%; border-collapse: collapse; margin: 6px 0 18px; }
        .spec-table th { text-align: left; padding: 9px 12px; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--primary); border-bottom: 2px solid var(--border); }
        .spec-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: top; }
        .spec-table td:first-child { font-weight: 600; width: 42%; color: var(--text); }
        .spec-details { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); margin-bottom: 10px; overflow: hidden; }
        .spec-details > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; color: var(--primary); list-style: none; display: flex; align-items: center; gap: 9px; user-select: none; }
        .spec-details > summary::-webkit-details-marker { display: none; }
        .spec-details > summary::before { content: "\f078"; font-family: "Font Awesome 6 Free"; font-weight: 900; font-size: 0.7rem; transition: transform 0.2s; }
        .spec-details[open] > summary::before { transform: rotate(180deg); }
        .spec-details > .detail-body { padding: 0 16px 8px; }
        .spec-details .spec-table { margin-top: 0; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
        .gallery-item { margin: 0; }
        .gallery-item a { display: block; overflow: hidden; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        .gallery-item img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; transition: transform 0.25s; }
        .gallery-item a:hover img { transform: scale(1.05); }
        .gallery-item figcaption { margin-top: 7px; font-size: 0.82rem; color: var(--muted); text-align: center; line-height: 1.35; }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="../../index.html" class="brand"><span>MI</span></a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme"></button>
            </div>
        </div>
    </header>

    <main class="project-detail">
        <div class="container" id="project-root">
            <a href="../../index.html#projects" class="back-link"><i class="fa fa-arrow-left"></i> Back to projects</a>
            <div id="project-content"><p>Loading…</p></div>
        </div>
    </main>

    <footer>
        <p><span id="footer-year">2026</span> | Mainul Islam</p>
    </footer>

    <script>
        (function () {
            const root = document.documentElement;
            const saved = localStorage.getItem("theme");
            const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            root.setAttribute("data-theme", saved || "light");
            const themeToggle = document.getElementById("theme-toggle");
            const icon = () => themeToggle.innerHTML = root.getAttribute("data-theme") === "light"
                ? '<i class="fa-regular fa-moon"></i>' : '<i class="fa-regular fa-sun"></i>';
            icon();
            themeToggle.addEventListener("click", () => {
                const t = root.getAttribute("data-theme") === "light" ? "dark" : "light";
                root.setAttribute("data-theme", t); localStorage.setItem("theme", t); icon();
            });
            document.getElementById("footer-year").textContent = new Date().getFullYear();

            const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
            // Inline markdown on ALREADY-escaped text: bold, code, links.
            const mdInline = (t) => t
                .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
                .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/`([^`]+)`/g, '<code>$1</code>');
            const inline = (s) => mdInline(esc(s));

            // Minimal block markdown → HTML: headings, tables, lists, paragraphs, hr.
            function renderMarkdown(md) {
                const lines = String(md || "").replace(/\r/g, "").split("\n");
                const splitRow = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(s => s.trim());
                let html = "", i = 0;
                while (i < lines.length) {
                    const line = lines[i];
                    if (/^\s*$/.test(line)) { i++; continue; }
                    const h = line.match(/^(#{1,4})\s+(.*)$/);
                    if (h) { const lvl = Math.min(h[1].length + 1, 4); html += `<h${lvl}>${inline(h[2].trim())}</h${lvl}>`; i++; continue; }
                    if (/^\s*-{3,}\s*$/.test(line)) { i++; continue; }
                    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
                        const header = splitRow(line); i += 2; const body = [];
                        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { body.push(splitRow(lines[i])); i++; }
                        html += `<table class="spec-table"><thead><tr>${header.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
                        continue;
                    }
                    if (/^\s*[-*]\s+/.test(line)) {
                        const items = [];
                        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
                        html += `<ul>${items.map(it => `<li>${inline(it)}</li>`).join("")}</ul>`;
                        continue;
                    }
                    const para = [];
                    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !/^#{1,4}\s/.test(lines[i]) && !/^\s*\|.*\|\s*$/.test(lines[i]) && !/^\s*-{3,}\s*$/.test(lines[i])) { para.push(lines[i]); i++; }
                    html += `<p>${inline(para.join(" "))}</p>`;
                }
                return html;
            }

            // Split a specs markdown file into collapsible <details> per "## Heading" section.
            function renderSpecsDropdowns(mdText) {
                const lines = String(mdText || "").replace(/\r/g, "").split("\n");
                const sections = [];
                let cur = null;
                for (const ln of lines) {
                    const h2 = ln.match(/^##\s+(.*)$/);
                    if (h2) { cur = { title: h2[1].trim(), body: [] }; sections.push(cur); continue; }
                    if (/^#\s+/.test(ln)) continue; // skip a top-level title line
                    if (cur) cur.body.push(ln);
                }
                if (!sections.length) {
                    return `<details class="spec-details"><summary>Specifications</summary><div class="detail-body">${renderMarkdown(mdText)}</div></details>`;
                }
                return sections.map(s =>
                    `<details class="spec-details"><summary>${esc(s.title)}</summary><div class="detail-body">${renderMarkdown(s.body.join("\n"))}</div></details>`
                ).join("");
            }

            // Turn an image file path into a readable caption.
            const ACRONYMS = ["PCB", "UAV", "AGV", "ROV", "EOD", "IR", "GPS", "LED", "VTOL", "RGB", "UART", "SPI", "I2C", "CAN", "MCU", "AI", "OCR", "IMU", "RTSP", "3D", "2D"];
            function prettyName(path) {
                let n = String(path).split("/").pop().replace(/\.[^.]+$/, "");
                n = n.replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim();
                n = n.charAt(0).toUpperCase() + n.slice(1);
                n = n.replace(/[A-Za-z0-9]+/g, (w) => ACRONYMS.includes(w.toUpperCase()) ? w.toUpperCase() : w);
                return n;
            }

            const fetchMd = (path) => fetch("../../" + encodeURI(path)).then(r => r.ok ? r.text() : "").catch(() => "");

            const idx = parseInt(new URLSearchParams(location.search).get("i"), 10);
            const container = document.getElementById("project-content");

            fetch("../../data/Profile/profile.json")
                .then(r => r.json())
                .then(profile => {
                    const p = (profile.projects || [])[idx];
                    if (!p) { container.innerHTML = "<p>Project not found.</p>"; return; }
                    document.title = (p.title || "Project") + " | Portfolio";

                    const jobs = [];
                    if (p.descriptionFile) jobs.push(fetchMd(p.descriptionFile).then(md => ["desc", md]));
                    if (p.specsFile) jobs.push(fetchMd(p.specsFile).then(md => ["specs", md]));

                    Promise.all(jobs).then(results => {
                        const md = {}; results.forEach(([k, v]) => md[k] = v);

                        const statusClass = p.status ? p.status.toLowerCase().replace(/[^a-z0-9]+/g, "-") : "";
                        // Absolute URLs pass through; site-root-relative paths are resolved from this subpage.
                        const resolveHref = (h) => /^(https?:|mailto:)/.test(h) ? h : "../../" + encodeURI(h);
                        const linksHtml = (p.links || []).length
                            ? `<div class="detail-links">${p.links.map(l =>
                                `<a class="btn btn-ghost" href="${esc(resolveHref(l.href))}" target="_blank" rel="noopener">${l.icon ? `<i class="${esc(l.icon)}"></i> ` : ""}${esc(l.label)}</a>`).join("")}</div>`
                            : "";

                        const overview = md.desc ? renderMarkdown(md.desc) : (p.description ? `<p>${esc(p.description)}</p>` : "");
                        const overviewHtml = overview
                            ? `<h2 class="detail-section-title">Overview</h2><div class="detail-body">${overview}</div>` : "";

                        const contributionHtml = (p.contribution || []).length
                            ? `<h2 class="detail-section-title">My Contribution</h2><ul class="contribution-list">${p.contribution.map(c => `<li>${inline(c)}</li>`).join("")}</ul>` : "";

                        const specsHtml = md.specs
                            ? `<h2 class="detail-section-title">Specifications</h2>${renderSpecsDropdowns(md.specs)}` : "";

                        const galleryHtml = (p.gallery || []).length
                            ? `<h2 class="detail-section-title">Gallery</h2><div class="gallery">${p.gallery.map(g => {
                                const src = esc(resolveHref(g)); const cap = esc(prettyName(g));
                                return `<figure class="gallery-item"><a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${cap}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
                              }).join("")}</div>` : "";

                        container.innerHTML = `
                            ${p.image ? `<img class="project-hero-img" src="${esc(resolveHref(p.image))}" alt="${esc(p.title)}">` : ""}
                            <h1>${esc(p.title)}</h1>
                            ${p.subtitle ? `<p class="subtitle">${esc(p.subtitle)}</p>` : ""}
                            <div class="detail-meta">
                                ${p.status ? `<span class="status-badge ${statusClass}">${esc(p.status)}</span>` : ""}
                                ${p.note ? `<span class="detail-note">${esc(p.note)}</span>` : ""}
                            </div>
                            ${linksHtml}
                            ${overviewHtml}
                            ${contributionHtml}
                            ${specsHtml}
                            ${galleryHtml}`;
                    });
                })
                .catch(() => container.innerHTML = "<p>Failed to load project.</p>");
        })();
    </script>
</body>

</html>
