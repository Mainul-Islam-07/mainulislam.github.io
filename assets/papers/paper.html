<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper | Portfolio</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; }
        .paper-head { padding: 18px 0 14px; border-bottom: 1px solid var(--border); }
        .back-link { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--primary); font-weight: 600; font-size: 0.9rem; }
        .paper-head h1 { font-size: clamp(1.1rem, 2.6vw, 1.5rem); line-height: 1.3; margin-bottom: 6px; }
        .paper-meta { color: var(--muted); font-size: 0.9rem; }
        .paper-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .paper-actions .btn { padding: 8px 16px; font-size: 0.88rem; }
        .pdf-frame-wrap { flex: 1; min-height: 60vh; background: var(--tag-bg); border-top: 1px solid var(--border); }
        .pdf-frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
        .pdf-fallback { padding: 40px 20px; text-align: center; color: var(--muted); }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="../../index.html" class="brand"><span>MI</span></a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme"></button>
            </div>
        </div>
    </header>

    <div class="paper-head">
        <div class="container">
            <a href="../../index.html#publications" class="back-link"><i class="fa fa-arrow-left"></i> Back to Publications</a>
            <div id="paper-info"><h1>Loading…</h1></div>
        </div>
    </div>

    <div class="pdf-frame-wrap" id="pdf-wrap"></div>

    <script>
        (function () {
            const root = document.documentElement;
            const saved = localStorage.getItem("theme");
            const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            root.setAttribute("data-theme", saved || "light");
            const themeToggle = document.getElementById("theme-toggle");
            const icon = () => themeToggle.innerHTML = root.getAttribute("data-theme") === "light"
                ? '<i class="fa-regular fa-moon"></i>' : '<i class="fa-regular fa-sun"></i>';
            icon();
            themeToggle.addEventListener("click", () => {
                const t = root.getAttribute("data-theme") === "light" ? "dark" : "light";
                root.setAttribute("data-theme", t); localStorage.setItem("theme", t); icon();
            });

            const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
            const idx = parseInt(new URLSearchParams(location.search).get("i"), 10);
            const info = document.getElementById("paper-info");
            const wrap = document.getElementById("pdf-wrap");

            fetch("../../data/Profile/profile.json")
                .then(r => r.json())
                .then(profile => {
                    const p = (profile.publications || [])[idx];
                    if (!p) { info.innerHTML = "<h1>Paper not found.</h1>"; return; }
                    document.title = (p.title || "Paper") + " | Portfolio";

                    const doiLink = p.doi
                        ? (/^arxiv:/i.test(p.doi)
                            ? "https://arxiv.org/abs/" + p.doi.replace(/^arxiv:/i, "")
                            : (p.doi.startsWith("http") ? p.doi : "https://doi.org/" + p.doi))
                        : "";
                    const doiLabel = /^arxiv:/i.test(p.doi || "") ? "arXiv" : "DOI";
                    const pdfSrc = p.pdf ? "../../" + p.pdf : "";

                    info.innerHTML = `
                        ${p.type ? `<span class="pub-type">${esc(p.type)}</span>` : ""}
                        <h1>${esc(p.title)}</h1>
                        <p class="paper-meta">${[p.authors, p.venue, p.year].filter(Boolean).map(esc).join(" · ")}${p.note ? ` <span class="pub-badge">${esc(p.note)}</span>` : ""}</p>
                        <div class="paper-actions">
                            ${pdfSrc ? `<a class="btn btn-ghost" href="${esc(pdfSrc)}" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> Open in new tab</a>` : ""}
                            ${pdfSrc ? `<a class="btn btn-ghost" href="${esc(pdfSrc)}" download><i class="fa-solid fa-download"></i> Download</a>` : ""}
                            ${doiLink ? `<a class="btn btn-ghost" href="${esc(doiLink)}" target="_blank" rel="noopener"><i class="fa-solid fa-link"></i> ${doiLabel}</a>` : ""}
                        </div>`;

                    wrap.innerHTML = pdfSrc
                        ? `<iframe src="${esc(pdfSrc)}#view=FitH" title="${esc(p.title)}"></iframe>`
                        : `<div class="pdf-fallback">No PDF attached to this publication.</div>`;
                })
                .catch(() => { info.innerHTML = "<h1>Failed to load paper.</h1>"; });
        })();
    </script>
</body>

</html>
